services:
  zap:
    image: zaproxy/zap-stable
    container_name: wave_zap
    restart: unless-stopped
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=j9u08qi9sjf2b759acqeg79vq7
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.4
    container_name: wave_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wave_lite_app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wave_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      CONTAINER_ROLE: app
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wave_lite_app
      DB_USERNAME: root
      DB_PASSWORD: "root"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      NUCLEI_ENABLED: "true"
      NUCLEI_BINARY: /usr/local/bin/nuclei
      ZAP_HOST: zap
      ZAP_PORT: 8080
      ZAP_API_KEY: j9u08qi9sjf2b759acqeg79vq7
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wave_worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wave_lite_app
      DB_USERNAME: root
      DB_PASSWORD: "root"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      NUCLEI_ENABLED: "true"
      NUCLEI_BINARY: /usr/local/bin/nuclei
      NUCLEI_TIMEOUT: 180
      NUCLEI_SEVERITY: high,medium
      NUCLEI_TEMPLATES: /root/nuclei-templates/http/misconfiguration
      NIKTO_ENABLED: "true"
      NIKTO_BINARY: /usr/local/bin/nikto
      NIKTO_MAXTIME: 3m
      NIKTO_PROCESS_TIMEOUT: 240
      ZAP_HOST: zap
      ZAP_PORT: 8080
      ZAP_API_KEY: j9u08qi9sjf2b759acqeg79vq7
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wave_scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wave_lite_app
      DB_USERNAME: root
      DB_PASSWORD: "root"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      ZAP_HOST: zap
      ZAP_PORT: 8080
      ZAP_API_KEY: j9u08qi9sjf2b759acqeg79vq7
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

volumes:
  mysql_data:
